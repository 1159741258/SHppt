name: Codex Issue Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub Issue number to implement
        required: true
        type: string

concurrency:
  group: codex-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  generate_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      has_patch: ${{ steps.capture_patch.outputs.has_patch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "issue_number must be an integer" >&2
            exit 1
          fi

          mkdir -p .github/codex/runtime
          gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,labels,url \
            > .github/codex/runtime/issue.json

          if ! jq -e '.labels | map(.name) | index("ready-for-agent")' \
            .github/codex/runtime/issue.json > /dev/null; then
            echo "Issue #$ISSUE_NUMBER must have the ready-for-agent label" >&2
            exit 1
          fi

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: https://www.fucheers.top/v1/responses
          model: gpt-5.6-luna
          effort: max
          sandbox: workspace-write
          prompt-file: .github/codex/prompts/implement-issue.md
          output-file: ${{ runner.temp }}/codex-output.md

      - name: Capture Codex patch
        id: capture_patch
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/codex/runtime/issue.json
          rm -f "${RUNNER_TEMP}/codex-output.md"
          git add -N .
          git diff --binary HEAD > "$RUNNER_TEMP/codex.patch"

          if [[ -s "$RUNNER_TEMP/codex.patch" ]]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Codex patch
        if: steps.capture_patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex.patch
          if-no-files-found: error

  open_pull_request:
    if: needs.generate_patch.outputs.has_patch == 'true'
    needs: generate_patch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Codex patch
        uses: actions/download-artifact@v4
        with:
          name: codex-patch-${{ github.run_id }}

      - name: Apply patch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          git apply --index codex.patch

          branch="codex/issue-${ISSUE_NUMBER}-${RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement issue #${ISSUE_NUMBER}"

          gh auth setup-git
          git push --set-upstream origin "$branch"

          cat > pr-body.md <<EOF
          Codex generated this change for #${ISSUE_NUMBER}.

          Fixes #${ISSUE_NUMBER}

          The PR must pass the repository checks and receive human review before merging.
          EOF

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Implement issue #${ISSUE_NUMBER}" \
            --body-file pr-body.md
