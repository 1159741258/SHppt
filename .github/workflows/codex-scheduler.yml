name: Codex Frontier Scheduler

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned, unassigned]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: codex-frontier-scheduler
  cancel-in-progress: false

jobs:
  cleanup_closed_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Release the Issue lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        shell: bash
        run: |
          set -euo pipefail

          issue_numbers="$(printf '%s\n' "$PR_BODY" \
            | grep -Eio '(fix(es|ed)?|close(s|d)?|resolve(s|d)?) #[0-9]+' \
            | grep -Eo '[0-9]+' \
            | sort -u || true)"

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            gh issue edit "$issue_number" --remove-label agent-running || true

            if [[ "$PR_MERGED" != "true" ]]; then
              gh issue edit "$issue_number" --add-label ready-for-agent || true
              gh issue comment "$issue_number" --body "$(cat <<EOF
          > *This was generated by AI during triage.*

          The Codex pull request was closed without merging. The Issue is available on the agent frontier again.
          EOF
              )"
            fi
          done <<< "$issue_numbers"

  discover_frontier:
    needs: cleanup_closed_pull_request
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    outputs:
      has_work: ${{ steps.select.outputs.has_work }}
      issue_number: ${{ steps.select.outputs.issue_number }}
    steps:
      - name: Select and claim the first frontier Issue
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "has_work=false" >> "$GITHUB_OUTPUT"
          echo "issue_number=" >> "$GITHUB_OUTPUT"

          candidates="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label ready-for-agent \
            --limit 1000 \
            --json number,title,body,labels,assignees,createdAt,url \
            | jq 'sort_by(.number)')"

          while IFS= read -r candidate; do
            issue_number="$(jq -r '.number' <<< "$candidate")"

            if jq -e '(.labels | map(.name)) | any(.[]; . == "agent-running" or . == "ready-for-human" or . == "wontfix")' <<< "$candidate" > /dev/null; then
              continue
            fi

            if jq -e '.assignees | length > 0' <<< "$candidate" > /dev/null; then
              continue
            fi

            comments="$(gh issue view "$issue_number" \
              --repo "$REPO" \
              --json comments \
              --jq '[.comments[].body]')"

            if ! jq -e 'any(.[]; contains("## Agent Brief") and contains("**Acceptance criteria:**") and contains("**Out of scope:**"))' <<< "$comments" > /dev/null; then
              continue
            fi

            dependency_count="$(gh api "repos/$REPO/issues/$issue_number" \
              --jq '.issue_dependencies_summary.blocked_by // 0')"
            if [[ "$dependency_count" != "0" ]]; then
              continue
            fi

            active_codex_pr="$(gh pr list \
              --repo "$REPO" \
              --state open \
              --limit 1000 \
              --json headRefName,body \
              | jq --arg issue_number "$issue_number" '[.[] | select((.headRefName | startswith("codex/issue-" + $issue_number + "-")) or (((.body // "") | test("(?i)(fixes|closes|resolves) #" + $issue_number + "([^0-9]|$)"))))] | length')"
            if [[ "$active_codex_pr" != "0" ]]; then
              continue
            fi

            gh issue edit "$issue_number" --repo "$REPO" --add-label agent-running
            gh issue comment "$issue_number" --repo "$REPO" --body "$(cat <<EOF
          > *This was generated by AI during triage.*

          The Codex frontier scheduler claimed this Issue. It will be processed only while it remains open, agent-ready, and unblocked.
          EOF
            )"

            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
            break
          done < <(jq -c '.[]' <<< "$candidates")

  run_codex:
    needs: discover_frontier
    if: needs.discover_frontier.outputs.has_work == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/codex-issue.yml
    with:
      issue_number: ${{ needs.discover_frontier.outputs.issue_number }}
    secrets: inherit
