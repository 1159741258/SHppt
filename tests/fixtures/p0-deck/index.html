<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SHppt fixed preview deck</title>
    <link rel="stylesheet" href="./styles/deck.css">
  </head>
  <body>
    <main class="deck-shell">
      <section class="slide cover-slide" data-od-slide="cover" data-screen-label="Cover">
        <div class="eyebrow" data-od-id="cover-eyebrow">SHppt / P0 RUNTIME</div>
        <h1 data-od-id="cover-title">A dependable HTML deck preview</h1>
        <p data-od-id="cover-subtitle">The first slide is rendered by a local daemon and a fixed browser adapter.</p>
        <div class="cover-rule" aria-hidden="true"></div>
      </section>
      <section class="slide detail-slide" data-od-slide="detail" data-screen-label="Detail">
        <div class="detail-copy">
          <div class="eyebrow" data-od-id="detail-eyebrow">OBSERVABLE BY DESIGN</div>
          <h2 data-od-id="detail-title">Bridge first, preview second</h2>
          <p data-od-id="detail-card">A valid handshake, a non-empty DOM observation, and a real PNG are one result.</p>
        </div>
        <img class="detail-mark" data-od-id="detail-mark" src="assets/fixture-mark.svg" alt="Fixed runtime mark">
      </section>
    </main>
  </body>
</html>
